<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Vinix - Directory Routing...</title>
    <script type="text/javascript">
        // Single Page Apps for GitHub Pages
        // MIT License
        // https://github.com/rafgraph/spa-github-pages
        // This script takes the current url and converts the path and query string into just a query string,
        // then redirects the browser to the new url with only a query string and hash fragment,
        // e.g. http://example.com/one/two?a=b&c=d#qwe becomes http://example.com/?p=/one/two&q=a=b~and~c=d#qwe
        var pathSegmentsToKeep = 1;

        var l = window.location;
        l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=' +
            l.pathname.split('/').slice(1 + pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
            (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
    </script>
</head>

<body>
</body>

</html>
